name: Request Unity activation file

# Gera o arquivo .alf (pedido de ativacao) rodando o Unity direto num container,
# sem depender da action antiga do GameCI que parou de funcionar.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-alf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create activation request (.alf)
        run: |
          mkdir -p out
          chmod 777 out
          docker run --rm \
            -v "$PWD/out:/out" -w /out \
            unityci/editor:ubuntu-2022.3.62f1-base-3 \
            unity-editor -batchmode -nographics -quit \
            -createManualActivationFile -logfile - || true
          ls -la out

      - name: Upload .alf
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-request
          path: out/*.alf
          if-no-files-found: error
          retention-days: 3
