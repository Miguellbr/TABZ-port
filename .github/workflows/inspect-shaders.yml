name: Inspect original TABZ shaders

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-shaders.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download already-extracted TABZ builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38002674886 --repo Miguellbr/TABZ-port --name tabz-extracted-two-versions --dir extracted
      - name: Install Unity asset parser
        run: python -m pip install UnityPy
      - name: Inspect serialized Shader objects
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import UnityPy

          report = {"files": [], "shaders": [], "errors": []}
          roots = [Path("extracted/version-1"), Path("extracted/version-2")]
          for root in roots:
              if not root.exists():
                  report["errors"].append(f"Missing extracted directory: {root}")
                  continue
              files = [p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".assets", ".asset", ".bundle", ".unity3d"}]
              for path in files:
                  try:
                      env = UnityPy.load(str(path))
                      report["files"].append({"version": root.name, "path": path.relative_to(root).as_posix(), "objects": len(env.objects)})
                      for obj in env.objects:
                          if obj.type.name != "Shader":
                              continue
                          try:
                              data = obj.read()
                              if len(report["shaders"]) < 3:
                                  print("SHADER_PATH", getattr(data, "m_PathName", None))
                                  print("SHADER_SCRIPT", repr(getattr(data, "m_Script", None))[:2000])
                                  print("SHADER_GUID", repr(getattr(data, "m_AssetGUID", None)))
                                  parsed = getattr(data, "m_ParsedForm", None)
                                  print("PARSED_TYPE", type(parsed))
                                  print("PARSED_REPR", repr(parsed)[:12000])
                                  try:
                                      print("PARSED_DIR", [x for x in dir(parsed) if not x.startswith("__")][:100])
                                      print("PARSED_VARS", repr(vars(parsed))[:12000])
                                  except Exception as debug_exc:
                                      print("PARSED_DEBUG_ERROR", repr(debug_exc))
                                  print("PLATFORMS", repr(getattr(data, "platforms", None))[:2000])
                                  print("OFFSETS", repr(getattr(data, "offsets", None))[:2000])
                                  print("COMPRESSED_LENGTHS", repr(getattr(data, "compressedLengths", None))[:2000])
                                  print("DECOMPRESSED_LENGTHS", repr(getattr(data, "decompressedLengths", None))[:2000])
                                  print("DECOMPRESSED_SIZE", repr(getattr(data, "decompressedSize", None)))
                                  try:
                                      exported = data.export()
                                      print("SHADER_EXPORT_TYPE", type(exported))
                                      print("SHADER_EXPORT", repr(exported)[:12000])
                                  except Exception as export_exc:
                                      print("SHADER_EXPORT_ERROR", repr(export_exc))
                                  try:
                                      raw = obj.get_raw_data()
                                      print("SHADER_RAW", len(raw), raw[:64].hex())
                                  except Exception as raw_exc:
                                      print("SHADER_RAW_ERROR", repr(raw_exc))
                              fields = {}
                              for key in ("m_Name", "m_ParsedForm", "compressedBlob", "platforms", "offset", "compressedLengths", "decompressedLengths"):
                                  if hasattr(data, key):
                                      value = getattr(data, key)
                                      if isinstance(value, (bytes, bytearray)):
                                          fields[key] = {"bytes": len(value), "prefix_hex": bytes(value[:32]).hex()}
                                      elif isinstance(value, (str, int, float, bool)) or value is None:
                                          fields[key] = value
                                      else:
                                          fields[key] = str(value)[:1000]
                              report["shaders"].append({"version": root.name, "file": path.relative_to(root).as_posix(), "path_id": obj.path_id, "serialized_size": getattr(obj, "byte_size", None), "fields": fields})
                          except Exception as exc:
                              report["errors"].append(f"{path}:{obj.path_id}: {type(exc).__name__}: {exc}")
                  except Exception as exc:
                      report["errors"].append(f"{path}: {type(exc).__name__}: {exc}")
          report["summary"] = {"serialized_files": len(report["files"]), "shader_objects": len(report["shaders"]), "errors": len(report["errors"])}
          Path("shader-report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report["summary"], indent=2))
          for shader in report["shaders"]:
              print(shader["version"], shader["file"], shader["path_id"], shader["fields"].get("m_Name"), shader["serialized_size"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tabz-original-shader-report
          path: shader-report.json
          retention-days: 14
