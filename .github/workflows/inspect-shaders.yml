name: Inspect original TABZ shaders

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-shaders.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download already-extracted TABZ builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38002674886 --repo Miguellbr/TABZ-port --name tabz-extracted-two-versions --dir extracted
      - name: Install Unity asset parser
        run: python -m pip install UnityPy
      - name: Export original Shader objects
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          import UnityPy
          from UnityPy.export.ShaderConverter import ShaderProgram
          from UnityPy.helpers import CompressionHelper
          from UnityPy.streams import EndianBinaryReader

          report = {"files": [], "shaders": [], "errors": []}
          out = Path("exported-shaders")
          out.mkdir(exist_ok=True)
          roots = [Path("extracted/version-1"), Path("extracted/version-2")]
          for root in roots:
              if not root.exists():
                  report["errors"].append(f"Missing extracted directory: {root}")
                  continue
              files = [p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".assets", ".asset", ".bundle", ".unity3d"}]
              for path in files:
                  try:
                      env = UnityPy.load(str(path))
                      report["files"].append({"version": root.name, "path": path.relative_to(root).as_posix(), "objects": len(env.objects)})
                      for obj in env.objects:
                          if obj.type.name != "Shader":
                              continue
                          try:
                              shader = obj.parse_as_object()
                              parsed = getattr(shader, "m_ParsedForm", None)
                              name = getattr(parsed, "m_Name", "") if parsed else ""
                              if not name:
                                  name = obj.peek_name() or f"unnamed-{obj.path_id}"
                              safe = re.sub(r"[^A-Za-z0-9_.-]+", "_", name).strip("._") or f"unnamed-{obj.path_id}"
                              relative = path.relative_to(root).with_suffix("")
                              target_dir = out / root.name / relative
                              target_dir.mkdir(parents=True, exist_ok=True)
                              source = shader.export()
                              target = target_dir / f"{safe}_{obj.path_id}.shader"
                              target.write_text(source, encoding="utf-8", errors="replace")
                              dxbc_count = 0
                              if name in ("Hidden/DS_Haze", "Hidden/DS_HazeLightVolume", "Hidden/Post FX/Fog"):
                                  for platform_index, platform in enumerate(shader.platforms):
                                      if platform != 4:
                                          continue
                                      compressed_size = shader.compressedLengths[platform_index]
                                      decompressed_size = shader.decompressedLengths[platform_index]
                                      offset = shader.offsets[platform_index]
                                      compressed = bytes(shader.compressedBlob)[offset:offset + compressed_size]
                                      decompressed = CompressionHelper.decompress_lz4(compressed, decompressed_size)
                                      program = ShaderProgram(EndianBinaryReader(decompressed, endian="<"), shader.object_reader.version)
                                      dxbc_dir = Path("raw-dxbc") / root.name / safe / f"platform-{platform}"
                                      dxbc_dir.mkdir(parents=True, exist_ok=True)
                                      for sub_index, subprogram in enumerate(program.m_SubPrograms):
                                          code = bytes(subprogram.m_ProgramCode)
                                          if not code:
                                              continue
                                          dxbc_offset = code.find(b"DXBC")
                                          program_type = getattr(subprogram.m_ProgramType, "name", str(subprogram.m_ProgramType))
                                          output = dxbc_dir / f"program-{sub_index}-{program_type}.bin"
                                          output.write_bytes(code[dxbc_offset:] if dxbc_offset >= 0 else code)
                                          dxbc_count += 1
                                          print("DXBC_EXTRACT", root.name, name, sub_index, program_type, len(code), "dxbc_offset", dxbc_offset, "prefix", code[:32].hex(), ",".join(subprogram.m_Keywords))
                              report["shaders"].append({
                                  "version": root.name,
                                  "file": path.relative_to(root).as_posix(),
                                  "path_id": obj.path_id,
                                  "name": name,
                                  "serialized_size": getattr(obj, "byte_size", None),
                                  "export_file": target.relative_to(out).as_posix(),
                                  "export_chars": len(source),
                                  "dxbc_programs_extracted": dxbc_count,
                                  "has_haze_terms": bool(re.search(r"haze|fog|deep.?sky|extinction|scattering", name + "\\n" + source, re.I)),
                              })
                          except Exception as exc:
                              report["errors"].append(f"{path}:{obj.path_id}: {type(exc).__name__}: {exc}")
                  except Exception as exc:
                      report["errors"].append(f"{path}: {type(exc).__name__}: {exc}")
          report["summary"] = {
              "serialized_files": len(report["files"]),
              "shader_objects": len(report["shaders"]),
              "shader_exports": sum(1 for x in report["shaders"] if x.get("export_chars")),
              "haze_term_matches": sum(1 for x in report["shaders"] if x.get("has_haze_terms")),
              "dxbc_programs_extracted": sum(x.get("dxbc_programs_extracted", 0) for x in report["shaders"]),
              "errors": len(report["errors"]),
          }
          Path("shader-report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report["summary"], indent=2))
          for shader in report["shaders"]:
              print(shader["version"], shader["name"], shader["file"], shader["path_id"], shader["export_chars"], "HAZE" if shader["has_haze_terms"] else "")
          for error in report["errors"][:30]:
              print("ERROR", error)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tabz-original-shader-report
          path: |
            shader-report.json
            exported-shaders/
            raw-dxbc/
          retention-days: 14

  decompile:
    needs: inspect
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tabz-original-shader-report
          path: artifact
      - name: Download DXBC to HLSL decompiler
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "fxcd.zip"
          $dir = Join-Path $env:RUNNER_TEMP "fxcd"
          Invoke-WebRequest -Uri "https://github.com/hellokenlee/fxcd/releases/download/v0.2.1/fxcd-v0.2.1.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Filter "fxcd.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "fxcd.exe was not found in the release archive" }
          "FXCD_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Decompile original DeepSky DXBC programs
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "artifact/raw-dxbc" -Filter "*.bin" -Recurse
          if (-not $files) { throw "No extracted DXBC programs were found" }
          $success = 0
          $failed = 0
          foreach ($file in $files) {
            & $env:FXCD_PATH -D $file.FullName
            $hlsl = [System.IO.Path]::ChangeExtension($file.FullName, ".hlsl")
            if (Test-Path $hlsl) {
              $success++
              Write-Host "DECOMPILED $($file.FullName) -> $hlsl"
            } else {
              $failed++
              Write-Host "NO_OUTPUT $($file.FullName)"
            }
          }
          "Decompiled: $success; without output: $failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tabz-decompiled-haze-hlsl
          path: artifact/raw-dxbc/
          retention-days: 14
