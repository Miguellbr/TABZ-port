name: Build TABZ Android prototype APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check Unity license secret
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Missing repository secret UNITY_LICENSE. A valid Unity license is required before this workflow can compile an APK."
            echo "See MobilePort/ANDROID-BUILD.md for setup instructions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Build Android APK with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: MobilePort
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          buildMethod: TABZMobileBuild.BuildAndroid
          allowDirtyBuild: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TABZ-Mobile-Prototype-APK
          path: MobilePort/Builds/TABZ-Mobile-Prototype.apk
          if-no-files-found: error
          retention-days: 14
