name: Request Unity license activation file

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-activation:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Unity activation request
        id: activation
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-Request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
          retention-days: 7
