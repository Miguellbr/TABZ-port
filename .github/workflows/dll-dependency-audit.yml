name: TABZ DLL dependency audit

on:
  push:
    branches:
      - audit/original-input
    paths:
      - .github/workflows/dll-dependency-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-managed-assemblies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Checkout original TABZ v5.1 assemblies and plugins
        uses: actions/checkout@v4
        with:
          ref: tabz-v5.1
          path: original-source
          sparse-checkout: |
            TABZ/TABZ modded v5/GAME_Data/Managed
            TABZ/TABZ modded v5/GAME_Data/Plugins
            TABZ/TABZ modded v5/steam_api.dll

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install ILSpy
        run: dotnet tool install ilspycmd --tool-path ./ilspy-tools

      - name: Decompile assemblies and generate dependency report
        shell: bash
        run: |
          set -euo pipefail
          MANAGED="original-source/TABZ/TABZ modded v5/GAME_Data/Managed"
          PLUGINS="original-source/TABZ/TABZ modded v5/GAME_Data/Plugins"
          mkdir -p report/main report/firstpass
          ./ilspy-tools/ilspycmd -p -o report/main "$MANAGED/Assembly-CSharp.dll"
          ./ilspy-tools/ilspycmd -p -o report/firstpass "$MANAGED/Assembly-CSharp-firstpass.dll"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("report")
          original = Path("original-source/TABZ/TABZ modded v5")
          managed = original / "GAME_Data/Managed"
          plugins = original / "GAME_Data/Plugins"
          sections = ["# TABZ v5.1 managed DLL compatibility audit", ""]
          sections += ["## Original managed assemblies"]
          sections += [f"- {p.name}: {p.stat().st_size} bytes" for p in sorted(managed.glob("*.dll"))]
          sections += ["", "## Original plugin and native library files"]
          plugin_files = sorted(p for p in original.rglob("*") if p.is_file() and (p.suffix.lower() in {".dll", ".so", ".dylib"}))
          sections += [f"- {p.relative_to(original)}: {p.stat().st_size} bytes" for p in plugin_files]
          for label, folder, project in [
              ("Main assembly", root / "main", "Assembly-CSharp.csproj"),
              ("Firstpass assembly", root / "firstpass", "Assembly-CSharp-firstpass.csproj")
          ]:
              sections += ["", f"## {label} references"]
              csproj = folder / project
              if csproj.exists():
                  xml = csproj.read_text(errors="replace")
                  refs = re.findall(r'<Reference Include="([^"]+)"', xml)
                  sections += [f"- {x}" for x in refs] or ["- No references parsed"]
              else:
                  sections += ["- Project file missing"]
              files = list(folder.rglob("*.cs"))
              imports = {}
              namespaces = set()
              for p in files:
                  source = p.read_text(errors="replace")
                  for lib in re.findall(r'\[DllImport\s*\(\s*"([^"]+)"', source):
                      imports[lib] = imports.get(lib, 0) + 1
                  namespaces.update(re.findall(r'using\s+(UnityEngine\.[\w.]+)\s*;', source))
              sections += ["", f"### Native P/Invoke libraries ({label})"]
              sections += [f"- {name}: {count} declarations" for name, count in sorted(imports.items())] or ["- None found"]
              sections += ["", f"### Unity namespaces ({label})"]
              sections += [f"- {name}" for name in sorted(namespaces)] or ["- None found"]
              sections += ["", f"### Decompiled source count: {len(files)}"]
          sections += ["", "## Native library presence check"]
          imports = set()
          for folder in (root / "main", root / "firstpass"):
              for p in folder.rglob("*.cs"):
                  imports.update(re.findall(r'\[DllImport\s*\(\s*"([^"]+)"', p.read_text(errors="replace")))
          names = {p.stem.lower() for p in plugin_files}
          for name in sorted(imports):
              status = "matching file name found in original game tree" if name.lower() in names else "no matching plugin filename found in checked original game tree"
              sections += [f"- {name}: {status}"]
          sections += ["", "## Interpretation limits", "- This is a static inspection of decompiled managed code and repository files. It does not prove Unity 2022.3 Editor compatibility, Android compilation, or runtime behavior.", "- DLL references listed above are inferred from ILSpy-generated project files; native P/Invoke libraries are listed separately."]
          (root / "compatibility-audit.md").write_text("\n".join(sections) + "\n")
          PY

      - name: Upload compatibility audit
        uses: actions/upload-artifact@v4
        with:
          name: tabz-v5.1-dll-compatibility-audit
          path: report/
          if-no-files-found: error
          retention-days: 14
