name: Inspect decompiled DeepSky Haze

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-decompiled-haze.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download decompiled shader artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh run download 38301772658 --repo Miguellbr/TABZ-port --name tabz-decompiled-haze-hlsl --dir decompiled
      - name: Download Unity ShaderLab exports
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh run download 38301772658 --repo Miguellbr/TABZ-port --name tabz-original-shader-report --dir original-report
      - name: Print original ShaderLab metadata
        shell: pwsh
        run: |
          $targets = Get-ChildItem -Path "original-report/exported-shaders" -Recurse -Filter "Hidden_DS_Haze_*.shader"
          $targets += Get-ChildItem -Path "original-report/exported-shaders" -Recurse -Filter "Hidden_DS_HazeLightVolume_*.shader"
          $targets += Get-ChildItem -Path "original-report/exported-shaders" -Recurse -Filter "Hidden_Post_FX_Fog_*.shader"
          foreach ($file in $targets | Where-Object { $_.FullName -match "version-2" }) {
            Write-Host "===== BEGIN SHADERLAB $($file.FullName) ====="
            Get-Content -Raw $file.FullName
            Write-Host "===== END SHADERLAB $($file.FullName) ====="
          }
      - name: Print representative original haze programs
        shell: pwsh
        run: |
          $targets = @(
            "version-2/Hidden_DS_Haze/platform-4/program-1-kShaderGpuProgramDX11PixelSM40.hlsl",
            "version-2/Hidden_DS_Haze/platform-4/program-36-kShaderGpuProgramDX11PixelSM40.hlsl",
            "version-2/Hidden_DS_HazeLightVolume/platform-4/program-32-kShaderGpuProgramDX11PixelSM40.hlsl",
            "version-2/Hidden_Post_FX_Fog/platform-4/program-1-kShaderGpuProgramDX11PixelSM40.hlsl"
          )
          foreach ($relative in $targets) {
            $path = Join-Path "decompiled" $relative
            if (Test-Path $path) {
              Write-Host "===== BEGIN $relative ====="
              Get-Content -Raw $path
              Write-Host "===== END $relative ====="
            } else {
              Write-Host "MISSING $relative"
              Get-ChildItem -Path "decompiled" -Recurse -Filter "*.hlsl" | Select-Object -First 20 -ExpandProperty FullName
            }
          }
