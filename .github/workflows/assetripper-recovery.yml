name: TABZ recover Unity project with AssetRipper

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Which original TABZ archive to recover"
        required: true
        type: choice
        options:
          - v4
          - v5.1
        default: v5.1
      mode:
        description: "Unity project keeps editable assets; primary exports raw assets"
        required: true
        type: choice
        options:
          - Unity
          - Primary
        default: Unity

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install archive tools
        run: python -m pip install --upgrade gdown py7zr
      - name: Download original archive from source folder
        run: |
          mkdir -p downloads extracted output
          gdown --folder "https://drive.google.com/drive/folders/1Y9vmCWr31-b1du0SFkKop7DODTL9Qvoc?usp=drive_link" -O downloads
          python - <<'PY'
          import pathlib, shutil
          files = [p for p in pathlib.Path("downloads").rglob("*") if p.is_file() and p.suffix.lower() in {".zip", ".7z"} and p.name.lower() != "source.zip" and p.name.lower() != "source.7z"]
          def matches(p):
              n = p.name.lower()
              return ("v4" in n) if "${{ inputs.build }}" == "v4" else ("5.1" in n or "v5" in n)
          selected = [p for p in files if matches(p)]
          if len(selected) != 1:
              raise SystemExit("Could not uniquely select requested archive. Found: " + ", ".join(str(p) for p in files))
          shutil.copy2(selected[0], pathlib.Path("downloads") / ("source" + selected[0].suffix.lower()))
          print("Selected archive:", selected[0].name, "size:", selected[0].stat().st_size)
          PY
      - name: Extract original archive
        run: |
          python - <<'PY'
          import pathlib, zipfile, py7zr
          archive = next(p for p in pathlib.Path("downloads").glob("source.*"))
          dest = pathlib.Path("extracted/game")
          dest.mkdir(parents=True, exist_ok=True)
          if archive.suffix == ".zip":
              with zipfile.ZipFile(archive) as z:
                  for item in z.infolist():
                      rel = pathlib.PurePosixPath(item.filename.replace("\\\\", "/"))
                      if rel.is_absolute() or ".." in rel.parts: raise RuntimeError("Unsafe archive path")
                  z.extractall(dest)
          else:
              with py7zr.SevenZipFile(archive) as z:
                  for name in z.getnames():
                      rel = pathlib.PurePosixPath(name.replace("\\\\", "/"))
                      if rel.is_absolute() or ".." in rel.parts: raise RuntimeError("Unsafe archive path")
                  z.extractall(path=dest)
          PY
      - name: Download AssetRipper CLI
        run: |
          curl -fL --retry 3 "https://github.com/nowl-it/AssetRipperCLI/releases/download/v1.0.1/AssetRipper_linux_x64.zip" -o /tmp/assetripper.zip
          mkdir -p /tmp/assetripper
          unzip -q /tmp/assetripper.zip -d /tmp/assetripper
          chmod +x /tmp/assetripper/AssetRipper
          /tmp/assetripper/AssetRipper --help
      - name: Recover Unity project or primary assets
        run: |
          /tmp/assetripper/AssetRipper --cli \\
            --input "$GITHUB_WORKSPACE/extracted/game" \\
            --output "$GITHUB_WORKSPACE/output/${{ inputs.build }}" \\
            --mode "${{ inputs.mode }}" \\
            --script-content-level Level0 \\
            --log-path "$GITHUB_WORKSPACE/output/assetripper.log"
      - name: Summarize recovered content
        if: always()
        run: |
          python - <<'PY'
          import pathlib
          root = pathlib.Path("output")
          lines = ["# TABZ AssetRipper recovery", "", "A successful export does not guarantee the reconstructed project opens or builds without manual repair.", ""]
          if root.exists():
              files = [p for p in root.rglob("*") if p.is_file()]
              lines += [f"- Files exported: {len(files)}", f"- Total output size: {sum(p.stat().st_size for p in files) / (1024*1024):.1f} MiB", ""]
              for p in files[:150]: lines.append(f"- `{p.as_posix()}` ({p.stat().st_size} bytes)")
          pathlib.Path("output/RECOVERY-REPORT.md").write_text("\\n".join(lines))
          print("\\n".join(lines[:30]))
          PY
          cat output/RECOVERY-REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload recovered project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabz-assetripper-${{ inputs.build }}-${{ inputs.mode }}
          path: output/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 7
