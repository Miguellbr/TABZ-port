name: Map original DeepSky Haze pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/map-deepsky-haze.yml"

permissions:
  actions: read
  contents: read

jobs:
  map:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download previously extracted original TABZ builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh run download 38002674886 --repo Miguellbr/TABZ-port --name tabz-extracted-two-versions --dir extracted

      - name: Install analysis tools
        shell: pwsh
        run: |
          python -m pip install UnityPy
          dotnet tool install ilspycmd --tool-path "$env:RUNNER_TEMP\ilspy"
          "$env:RUNNER_TEMP\ilspy" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Map serialized shader passes to compiled programs
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          import UnityPy
          from UnityPy.export.ShaderConverter import ShaderProgram
          from UnityPy.helpers import CompressionHelper
          from UnityPy.streams import EndianBinaryReader

          TARGETS = {"Hidden/DS_Haze", "Hidden/DS_HazeLightVolume", "Hidden/Post FX/Fog"}
          FIELDS = (
              "m_BlobIndex", "m_Keywords", "m_GpuProgramType", "m_ShaderHardwareTier",
              "m_ShaderRequirements", "m_SourceMap", "m_VectorParams", "m_MatrixParams",
              "m_TextureParams", "m_BufferParams", "m_ConstantBuffers",
              "m_ConstantBufferBindings", "m_Samplers", "m_UAVParams"
          )

          def enum_text(value):
              if value is None:
                  return None
              return getattr(value, "name", str(value))

          def plain(value, depth=0):
              if depth > 4:
                  return repr(value)[:200]
              if value is None or isinstance(value, (str, int, float, bool)):
                  return value
              if isinstance(value, (bytes, bytearray)):
                  return f"<{len(value)} bytes>"
              if isinstance(value, (list, tuple)):
                  return [plain(x, depth + 1) for x in value[:100]]
              if hasattr(value, "__dict__"):
                  return {k: plain(v, depth + 1) for k, v in vars(value).items()
                          if not k.startswith("_") and k not in {"m_ProgramCode"}}
              return repr(value)[:300]

          def named_parameter_rows(parameters, index_to_name, matrix=False):
              rows = []
              for parameter in parameters or []:
                  name_index = getattr(parameter, "m_NameIndex", None)
                  row = {
                      "name": index_to_name.get(name_index, f"<name-index-{name_index}>"),
                      "register_index": getattr(parameter, "m_Index", None),
                      "byte_offset": getattr(parameter, "m_OffsetInConstantBuffer", None),
                      "array_size": getattr(parameter, "m_ArraySize", 0),
                  }
                  if matrix:
                      row["row_count"] = getattr(parameter, "m_RowCount", None)
                  else:
                      row["dimension"] = getattr(parameter, "m_Dim", None)
                  rows.append(row)
              return rows

          def parameter_layout(source, index_to_name):
              if source is None:
                  return {}
              result = {"constant_buffer_bindings": [], "constant_buffers": []}
              for binding in getattr(source, "m_ConstantBufferBindings", []) or []:
                  ni = getattr(binding, "m_NameIndex", None)
                  result["constant_buffer_bindings"].append({
                      "name": index_to_name.get(ni, f"<name-index-{ni}>"),
                      "slot": getattr(binding, "m_Index", None),
                  })
              for buffer in getattr(source, "m_ConstantBuffers", []) or []:
                  ni = getattr(buffer, "m_NameIndex", None)
                  result["constant_buffers"].append({
                      "name": index_to_name.get(ni, f"<name-index-{ni}>"),
                      "size_bytes": getattr(buffer, "m_Size", None),
                      "vectors": named_parameter_rows(getattr(buffer, "m_VectorParams", []), index_to_name),
                      "matrices": named_parameter_rows(getattr(buffer, "m_MatrixParams", []), index_to_name, matrix=True),
                  })
              for field in ("m_TextureParams", "m_Samplers", "m_BufferParams", "m_UAVParams"):
                  value = getattr(source, field, None)
                  if value is not None:
                      result[field] = plain(value)
              return result

          def stage_info(stage, index_to_name):
              if stage is None:
                  return None
              entries = []
              for index, sub in enumerate(getattr(stage, "m_SubPrograms", []) or []):
                  row = {"subprogram_index": index}
                  for field in FIELDS:
                      value = getattr(sub, field, None)
                      if value is None:
                          continue
                      if field == "m_GpuProgramType":
                          value = enum_text(value)
                      else:
                          value = plain(value)
                      row[field] = value
                  params = getattr(sub, "m_Parameters", None)
                  row["parameter_layout"] = parameter_layout(params, index_to_name) if params is not None else parameter_layout(sub, index_to_name)
                  entries.append(row)

              common = getattr(stage, "m_CommonParameters", None)
              common_data = parameter_layout(common, index_to_name)
              return {"common_parameters": common_data, "variants": entries}
          def get_attr(obj, *names):
              for name in names:
                  value = getattr(obj, name, None)
                  if value is not None:
                      return value
              return None

          root = Path("extracted/version-2")
          assets = sorted(p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".assets", ".asset", ".bundle", ".unity3d"})
          report = {"assets_scanned": 0, "shaders": [], "errors": []}
          for path in assets:
              try:
                  env = UnityPy.load(str(path))
                  report["assets_scanned"] += 1
                  for obj in env.objects:
                      if obj.type.name != "Shader":
                          continue
                      try:
                          shader = obj.parse_as_object()
                          parsed = getattr(shader, "m_ParsedForm", None)
                          name = getattr(parsed, "m_Name", "") if parsed else ""
                          if name not in TARGETS:
                              continue
                          shader_row = {
                              "name": name,
                              "asset": path.relative_to(root).as_posix(),
                              "path_id": int(obj.path_id),
                              "subshaders": []
                          }
                          for si, subshader in enumerate(getattr(parsed, "m_SubShaders", []) or []):
                              sub_row = {"subshader_index": si, "passes": []}
                              for pi, shader_pass in enumerate(getattr(subshader, "m_Passes", []) or []):
                                  state = get_attr(shader_pass, "m_State")
                                  pass_name = get_attr(state, "m_Name") or get_attr(shader_pass, "m_Name", "name")
                                  name_indices = get_attr(shader_pass, "m_NameIndices") or {}
                                  if isinstance(name_indices, dict):
                                      index_to_name = {int(v): k for k, v in name_indices.items() if isinstance(v, int)}
                                  else:
                                      index_to_name = {}
                                      for entry in name_indices:
                                          if isinstance(entry, dict):
                                              entry_name = entry.get("m_Name", entry.get("name", entry.get("first")))
                                              entry_index = entry.get("m_Index", entry.get("index", entry.get("second")))
                                          elif isinstance(entry, (list, tuple)) and len(entry) >= 2:
                                              entry_name, entry_index = entry[0], entry[1]
                                          else:
                                              entry_name = getattr(entry, "m_Name", getattr(entry, "name", getattr(entry, "first", None)))
                                              entry_index = getattr(entry, "m_Index", getattr(entry, "index", getattr(entry, "second", None)))
                                          if isinstance(entry_name, str) and isinstance(entry_index, int):
                                              index_to_name[entry_index] = entry_name
                                  vertex = get_attr(shader_pass, "progVertex", "m_ProgVertex")
                                  fragment = get_attr(shader_pass, "progFragment", "m_ProgFragment")
                                  serialized = get_attr(shader_pass, "m_SerializedProgram")
                                  sub_row["passes"].append({
                                      "pass_index": pi,
                                      "name": str(pass_name or ""),
                                      "name_indices": plain(name_indices),
                                      "vertex": stage_info(vertex, index_to_name),
                                      "fragment": stage_info(fragment, index_to_name),
                                      "serialized_program": plain(serialized) if serialized is not None else None
                                  })
                              shader_row["subshaders"].append(sub_row)

                          # Match the pass references to the DX11 program table used by UnityPy.
                          platform_index = next((i for i, p in enumerate(shader.platforms) if int(p) == 4), None)
                          if platform_index is not None:
                              size = shader.compressedLengths[platform_index]
                              offset = shader.offsets[platform_index]
                              decompressed_size = shader.decompressedLengths[platform_index]
                              blob = bytes(shader.compressedBlob)[offset:offset + size]
                              decompressed = CompressionHelper.decompress_lz4(blob, decompressed_size)
                              program = ShaderProgram(
                                  EndianBinaryReader(decompressed, endian="<"),
                                  shader.object_reader.version
                              )
                              shader_row["dx11_program_table"] = [
                                  {
                                      "table_index": i,
                                      "program_type": enum_text(getattr(sp, "m_ProgramType", None)),
                                      "keywords": list(getattr(sp, "m_Keywords", []) or []),
                                      "program_code_bytes": len(bytes(getattr(sp, "m_ProgramCode", b"") or b"")),
                                      "dxbc_offset": bytes(getattr(sp, "m_ProgramCode", b"") or b"").find(b"DXBC")
                                  }
                                  for i, sp in enumerate(getattr(program, "m_SubPrograms", []) or [])
                              ]
                          report["shaders"].append(shader_row)
                      except Exception as exc:
                          report["errors"].append(f"{path}:{obj.path_id}: {type(exc).__name__}: {exc}")
              except Exception as exc:
                  report["errors"].append(f"{path}: {type(exc).__name__}: {exc}")

          Path("haze-shader-pass-map.json").write_text(json.dumps(report, indent=2, default=str), encoding="utf-8")
          print("ASSETS_SCANNED", report["assets_scanned"])
          print("TARGET_SHADERS", len(report["shaders"]))
          print("ERRORS", len(report["errors"]))
          for shader in report["shaders"]:
              print(f"\n===== {shader['name']} | {shader['asset']} | path_id={shader['path_id']} =====")
              for sub in shader["subshaders"]:
                  for p in sub["passes"]:
                      print(f"PASS {p['pass_index']}: {p['name']}")
                      print("  name_indices raw:", json.dumps(p["name_indices"], default=str)[:3000])
                      for stage_name in ("vertex", "fragment"):
                          stage = p[stage_name]
                          if not stage:
                              continue
                          variants = stage["variants"]
                          print(f"  {stage_name}: {len(variants)} serialized variants")
                          seen_layouts = set()
                          for v in variants:
                              layout = v.get("parameter_layout", {})
                              if not any(layout.get(k) for k in ("constant_buffer_bindings", "constant_buffers", "m_TextureParams", "m_Samplers", "m_BufferParams", "m_UAVParams")):
                                  continue
                              signature = json.dumps(layout, sort_keys=True, default=str)
                              if signature in seen_layouts:
                                  continue
                              seen_layouts.add(signature)
                              print("  subprogram layout:", json.dumps({
                                  "blob_index": v.get("m_BlobIndex"),
                                  "gpu_type": v.get("m_GpuProgramType"),
                                  "layout": layout
                              }, default=str)[:10000])
                          for v in variants:
                              print("   ", json.dumps({k:v.get(k) for k in ("subprogram_index","m_BlobIndex","m_GpuProgramType","m_ShaderHardwareTier","m_Keywords","m_ShaderRequirements") if k in v}, default=str))
                          if stage["common_parameters"]:
                              print("  named cbuffer reflection:", json.dumps(stage["common_parameters"], default=str)[:12000])
              print("DX11 table entries:", len(shader.get("dx11_program_table", [])))
              for entry in shader.get("dx11_program_table", []):
                  print("  DX11", json.dumps(entry, default=str))
          for error in report["errors"][:50]:
              print("ERROR", error)
          '@ | Set-Content -Path map_shader_passes.py -Encoding utf8
          python map_shader_passes.py

      - name: Recover original C# haze controller and context code
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "extracted/version-2" -Filter "Assembly-CSharp.dll" -Recurse | Select-Object -First 1
          if (-not $dll) { throw "Assembly-CSharp.dll not found in the original v5.1 build" }
          $ilspy = Join-Path $env:RUNNER_TEMP "ilspy\ilspycmd.exe"
          $classes = & $ilspy -l c $dll.FullName
          $targets = $classes | ForEach-Object {
            if ($_ -match '^Class\s+(.+)$') { $Matches[1] }
            elseif ($_ -match '^\s*(.+)$') { $Matches[1].Trim() }
          } | Where-Object { $_ -match 'DS_Haze(View|Context|Core|ContextItem|Zone)|TABZChat|DayNightCycle' } | Sort-Object -Unique
          if (-not $targets) {
            Write-Host "No matching type names found in class listing:"
            $classes | Select-String -Pattern 'Haze|Fog|DayNight|TABZChat'
            throw "Could not locate DeepSky Haze types in Assembly-CSharp.dll"
          }
          New-Item -ItemType Directory -Force -Path "haze-source" | Out-Null
          foreach ($type in $targets) {
            Write-Host "===== DECOMPILE TYPE: $type ====="
            & $ilspy -t "$type" $dll.FullName 2>&1 | Tee-Object -FilePath "haze-source\$($type -replace '[^A-Za-z0-9_.-]','_').cs"
          }
          "Original DLL: $($dll.FullName)" | Set-Content "haze-source\SOURCE.txt"
          "Recovered types: $($targets -join ', ')" | Add-Content "haze-source\SOURCE.txt"

      - name: Upload shader mapping and recovered source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabz-deepsky-haze-mapping
          path: |
            haze-shader-pass-map.json
            haze-source/
          if-no-files-found: warn
          retention-days: 14
