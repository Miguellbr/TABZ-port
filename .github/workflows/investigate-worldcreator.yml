name: Investigate WorldCreatorReference (read-only)

on:
  push:
    branches: [tools/il-patch-input]
    paths:
      - 'Tools/Investigate/**'
      - 'Tools/IlRefScan/**'
      - '.github/workflows/investigate-worldcreator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tools
        uses: actions/checkout@v4

      - name: Checkout original v5.1
        uses: actions/checkout@v4
        with:
          ref: tabz-v5.1
          path: v51
          fetch-depth: 1
          sparse-checkout: |
            TABZ/TABZ modded v5

      - name: Checkout original v4 (managed assemblies, mods, logs)
        uses: actions/checkout@v4
        with:
          ref: tabz-v4
          path: v4
          fetch-depth: 1
          sparse-checkout: |
            TABZ/TABZ Modded v4/GAME_Data/Managed
            TABZ/TABZ Modded v4/MODS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: B. Player logs around the missing-script messages
        run: |
          mkdir -p out
          V5="v51/TABZ/TABZ modded v5"; V4="v4/TABZ/TABZ Modded v4"
          {
            for L in "$V5/GAME_Data/output_log.txt" "$V4/GAME_Data/output_log.txt"; do
              echo "### $L"
              grep -n -B8 -A4 'referenced script' "$L" | head -80 || true
              echo
            done
          } 2>&1 | tee out/B-logs-context.txt

      - name: E. Unity scene inspection (revision 2)
        run: |
          V5="v51/TABZ/TABZ modded v5"
          pip install UnityPy > /dev/null
          python3 Tools/Investigate/scan_scene.py "$V5/GAME_Data" 2>&1 | tee out/E-scene.txt || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabz-worldcreator-investigation-2
          path: out/
          retention-days: 14
