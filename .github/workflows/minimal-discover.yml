name: Minimal project - discovery (AssetRipper export listing)

on:
  push:
    branches: [tools/il-patch-input]
    paths:
      - '.github/workflows/minimal-discover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install archive tools
        run: python -m pip install --upgrade gdown py7zr

      - name: Download original v5.1 archive
        run: |
          mkdir -p downloads extracted output
          gdown --folder "https://drive.google.com/drive/folders/1Y9vmCWr31-b1du0SFkKop7DODTL9Qvoc?usp=drive_link" -O downloads
          python - <<'PY'
          import pathlib, shutil
          files = [p for p in pathlib.Path("downloads").rglob("*") if p.is_file() and p.suffix.lower() in {".zip", ".7z"} and p.name.lower() not in {"source.zip", "source.7z"}]
          selected = [p for p in files if ("5.1" in p.name.lower() or "v5" in p.name.lower())]
          if len(selected) != 1:
              raise SystemExit("Could not uniquely select archive. Found: " + ", ".join(str(p) for p in files))
          target = pathlib.Path("downloads") / ("source" + selected[0].suffix.lower())
          shutil.copy2(selected[0], target)
          print("Selected archive:", selected[0].name, selected[0].stat().st_size)
          PY

      - name: Extract
        run: |
          python - <<'PY'
          import pathlib, zipfile, py7zr
          archive = next(p for p in pathlib.Path("downloads").glob("source.*"))
          dest = pathlib.Path("extracted/game")
          dest.mkdir(parents=True, exist_ok=True)
          if archive.suffix.lower() == ".zip":
              with zipfile.ZipFile(archive) as z:
                  z.extractall(dest)
          else:
              with py7zr.SevenZipFile(archive) as z:
                  z.extractall(path=dest)
          root = next(p.parent for p in dest.rglob("*_Data") if (p / "globalgamemanagers").is_file())
          pathlib.Path("output/assetripper-input.txt").write_text(str(root.resolve()) + "\n")
          print("AssetRipper input root:", root)
          PY

      - name: Download AssetRipper CLI
        run: |
          curl -fL --retry 3 "https://github.com/nowl-it/AssetRipperCLI/releases/download/v1.0.1/AssetRipper_linux_x64.zip" -o /tmp/assetripper.zip
          mkdir -p /tmp/assetripper
          unzip -q /tmp/assetripper.zip -d /tmp/assetripper
          BIN="$(find /tmp/assetripper -type f | grep -Ei '/(AssetRipper|AssetRipperCLI|assetripper|AssetRipper[.]GUI[.]Free)$' | head -n 1)"
          chmod +x "$BIN"
          echo "ASSET_RIPPER_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Export Unity project
        run: |
          "$ASSET_RIPPER_BIN" --cli \
            --input "$(cat output/assetripper-input.txt)" \
            --output "$GITHUB_WORKSPACE/output/v5.1" \
            --mode Unity \
            --script-content-level Level2 \
            --log-path "$GITHUB_WORKSPACE/output/assetripper.log"
          du -sh output/v5.1

      - name: Discovery report
        run: |
          python Tools/Minimal/discover.py "$GITHUB_WORKSPACE/output/v5.1/ExportedProject/Assets" 2>&1 | tee output/discover.txt

      - name: Upload report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabz-minimal-discovery
          path: |
            output/discover.txt
            output/assetripper.log
          retention-days: 14
