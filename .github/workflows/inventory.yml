name: Inventory TABZ builds

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install download helper
        run: python -m pip install --upgrade gdown py7zr
      - name: Download public Drive folder
        run: |
          mkdir -p downloads extracted inventory
          gdown --folder "https://drive.google.com/drive/folders/1Y9vmCWr31-b1du0SFkKop7DODTL9Qvoc?usp=drive_link" -O downloads
      - name: Validate and extract both versions separately
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, zipfile, json, tarfile
          import py7zr
          source = pathlib.Path("downloads")
          target = pathlib.Path("extracted")
          supported = {".zip", ".7z"}
          archives = sorted((p for p in source.rglob("*") if p.is_file() and p.suffix.lower() in supported), key=lambda p: p.name.casefold())
          if len(archives) != 2:
              print("Expected exactly 2 archives (.zip or .7z) for two distinct TABZ versions; found:", len(archives))
              for p in source.rglob("*"):
                  if p.is_file():
                      print(f"{p} ({p.stat().st_size} bytes)")
              raise SystemExit("Stopping to avoid mixing versions.")
          def validate_member(out, name):
              # Reject absolute paths, parent traversal, and Windows-style traversal.
              normalized = name.replace("\\", "/")
              rel = pathlib.PurePosixPath(normalized)
              if rel.is_absolute() or any(part == ".." for part in rel.parts):
                  raise RuntimeError(f"Unsafe archive path: {name}")
              root = out.resolve()
              destination = (out / pathlib.Path(*rel.parts)).resolve()
              if destination != root and root not in destination.parents:
                  raise RuntimeError(f"Unsafe archive path: {name}")
          source_info = []
          for index, archive in enumerate(archives, 1):
              version = f"version-{index}"
              out = target / version
              out.mkdir(parents=True, exist_ok=True)
              if archive.suffix.lower() == ".zip":
                  with zipfile.ZipFile(archive) as zf:
                      for member in zf.infolist():
                          validate_member(out, member.filename)
                      zf.extractall(out)
              elif archive.suffix.lower() == ".7z":
                  with py7zr.SevenZipFile(archive, mode="r") as zf:
                      for member in zf.getnames():
                          validate_member(out, member)
                      zf.extractall(path=out)
              source_info.append({"version": version, "source_archive": archive.name, "archive_format": archive.suffix.lower().lstrip("."), "source_size_bytes": archive.stat().st_size})
              print(f"{archive.name} -> {out}")
          pathlib.Path("inventory/source-archives.json").write_text(json.dumps(source_info, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - name: Generate separate inventories
        run: |
          python scripts/inventory.py extracted/version-1 --output inventory/version-1
          python scripts/inventory.py extracted/version-2 --output inventory/version-2
      - name: Compare the two versions using normalized paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path, PurePosixPath
          base = Path("inventory")
          reports = {v: json.loads((base / v / "inventory.json").read_text(encoding="utf-8")) for v in ("version-1", "version-2")}

          def normalize_paths(report):
              files = report["files"]
              parts = [PurePosixPath(item["path"]).parts for item in files]
              # Archive versions often wrap all files in differently named root folders.
              # Strip that folder only when every file shares it and has a deeper path.
              strip_root = bool(parts) and all(len(p) > 1 for p in parts) and len({p[0] for p in parts}) == 1
              result = {}
              original_paths = {}
              for item, p in zip(files, parts):
                  normalized = PurePosixPath(* (p[1:] if strip_root else p)).as_posix()
                  result[normalized] = item
                  original_paths[normalized] = item["path"]
              return result, original_paths, (parts[0][0] if strip_root else None)

          normalized = {v: normalize_paths(reports[v]) for v in reports}
          a, paths_a, root_a = normalized["version-1"]
          b, paths_b, root_b = normalized["version-2"]
          only_a = sorted(set(a) - set(b))
          only_b = sorted(set(b) - set(a))
          changed = sorted(p for p in set(a) & set(b) if a[p]["size_bytes"] != b[p]["size_bytes"] or a[p]["sha256"] != b[p]["sha256"])
          result = {
              "version_1": {"file_count": reports["version-1"]["file_count"], "total_size_bytes": reports["version-1"]["total_size_bytes"], "stripped_archive_root": root_a},
              "version_2": {"file_count": reports["version-2"]["file_count"], "total_size_bytes": reports["version-2"]["total_size_bytes"], "stripped_archive_root": root_b},
              "paths_only_in_version_1": [{"normalized_path": p, "original_path": paths_a[p]} for p in only_a],
              "paths_only_in_version_2": [{"normalized_path": p, "original_path": paths_b[p]} for p in only_b],
              "same_path_but_different_content": [{"normalized_path": p, "version_1_path": paths_a[p], "version_2_path": paths_b[p]} for p in changed],
              "note": "Paths are compared after stripping a single common top-level archive folder when every file in that version shares it."
          }
          (base / "comparison.json").write_text(json.dumps(result, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          lines = [
              "# TABZ version comparison", "",
              f"- Version 1 files: **{result['version_1']['file_count']}** ({result['version_1']['total_size_bytes']:,} bytes)",
              f"- Version 2 files: **{result['version_2']['file_count']}** ({result['version_2']['total_size_bytes']:,} bytes)",
              f"- Version 1 stripped root folder: `{root_a or 'none'}`",
              f"- Version 2 stripped root folder: `{root_b or 'none'}`", "",
              "> Paths are normalized to avoid treating different archive root-folder names as file differences.", "",
              f"## Only in version 1 ({len(only_a)})", ""
          ]
          lines += [f"- `{p}` (original: `{paths_a[p]}`)" for p in only_a] or ["- None"]
          lines += ["", f"## Only in version 2 ({len(only_b)})", ""]
          lines += [f"- `{p}` (original: `{paths_b[p]}`)" for p in only_b] or ["- None"]
          lines += ["", f"## Same normalized path, different content ({len(changed)})", ""]
          lines += [f"- `{p}` (v1: `{paths_a[p]}`; v2: `{paths_b[p]}`)" for p in changed] or ["- None"]
          lines += ["", "This report contains file metadata only, not game binaries.", ""]
          (base / "COMPARISON.md").write_text("\n".join(lines), encoding="utf-8")
          print(f"Comparison created: {len(only_a)} unique to v1, {len(only_b)} unique to v2, {len(changed)} changed.")
          PY
      - name: Upload metadata reports only
        uses: actions/upload-artifact@v4
        with:
          name: tabz-two-version-inventory
          path: inventory/
          if-no-files-found: error
          retention-days: 14
