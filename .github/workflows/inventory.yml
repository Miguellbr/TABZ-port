name: Inventory TABZ builds

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install download helper
        run: python -m pip install --upgrade gdown

      - name: Download public Drive folder
        run: |
          mkdir -p downloads extracted
          gdown --folder "https://drive.google.com/drive/folders/1Y9vmCWr31-b1du0SFkKop7DODTL9Qvoc?usp=drive_link" --remaining-ok -O downloads

      - name: Extract ZIP builds safely
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, zipfile
          source = pathlib.Path("downloads")
          target = pathlib.Path("extracted")
          archives = sorted(source.rglob("*.zip"))
          if not archives:
              print("No ZIP files were found. Files downloaded:")
              for p in source.rglob("*"):
                  if p.is_file():
                      print(f"{p} ({p.stat().st_size} bytes)")
              raise SystemExit("No ZIPs found; Drive listing/download may have changed.")
          for index, archive in enumerate(archives, 1):
              out = target / f"build_{index}"
              out.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as zf:
                  root = out.resolve()
                  for member in zf.infolist():
                      destination = (out / member.filename).resolve()
                      if destination != root and root not in destination.parents:
                          raise RuntimeError(f"Unsafe path in ZIP: {member.filename}")
                  zf.extractall(out)
              print(f"Extracted {archive.name} -> {out}")
          print(f"Found {len(archives)} ZIP archive(s).")
          PY

      - name: Generate metadata inventory
        run: python scripts/inventory.py extracted --output inventory

      - name: Upload inventory report only
        uses: actions/upload-artifact@v4
        with:
          name: tabz-inventory
          path: inventory/
          if-no-files-found: error
          retention-days: 14
