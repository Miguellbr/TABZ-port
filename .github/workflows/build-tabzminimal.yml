name: Build TabzMinimal project (original DLLs, original prefabs)

on:
  push:
    branches: [tools/il-patch-input]
    paths:
      - 'Tools/Minimal/package_minimal.py'
      - 'Tools/Minimal/project/**'
      - 'Tools/IlTypes/**'
      - '.github/workflows/build-tabzminimal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout tools
        uses: actions/checkout@v4

      - name: Checkout original v5.1 managed assemblies
        uses: actions/checkout@v4
        with:
          ref: tabz-v5.1
          path: orig
          fetch-depth: 1
          sparse-checkout: |
            TABZ/TABZ modded v5/GAME_Data/Managed

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build IL tools
        run: |
          dotnet build Tools/IlPatch/IlPatch.csproj -c Release -o build/patcher > /dev/null
          dotnet build Tools/IlStub/IlStub.csproj -c Release -o build/stub > /dev/null
          dotnet build Tools/IlTypes/IlTypes.csproj -c Release -o build/types > /dev/null

      - name: Compile TabzInputShim against the original UnityEngine
        run: |
          set -euo pipefail
          M="orig/TABZ/TABZ modded v5/GAME_Data/Managed"
          read -r VER SDKDIR <<< "$(dotnet --list-sdks | tail -1 | sed -E 's/^([^ ]+) \[(.*)\]$/\1 \2/')"
          CSC="$SDKDIR/$VER/Roslyn/bincore/csc.dll"
          mkdir -p out/dlls
          dotnet "$CSC" -nologo -noconfig -nostdlib+ -target:library -optimize+ \
            -out:out/dlls/TabzInputShim.dll \
            -reference:"$M/mscorlib.dll" -reference:"$M/UnityEngine.dll" \
            Tools/IlPatch/TabzInput.cs

      - name: Patch the original DLLs (input to touch, Steam stubbed, FMOD silent)
        run: |
          set -euo pipefail
          M="orig/TABZ/TABZ modded v5/GAME_Data/Managed"
          dotnet build/patcher/TabzIlPatch.dll "$M/Assembly-CSharp.dll" out/dlls/TabzInputShim.dll out/dlls/Assembly-CSharp.dll "$M" --require-hits | tee out/patch-input.txt
          dotnet build/stub/TabzIlStub.dll "$M/Assembly-CSharp-firstpass.dll" out/dlls/Assembly-CSharp-firstpass.dll "$M" --steam --fmod-silent --require-hits | tee out/stub-native.txt
          cp "$M/Photon3Unity3D.dll" out/dlls/Photon3Unity3D.dll
          sha1sum "$M/Assembly-CSharp.dll" "$M/Assembly-CSharp-firstpass.dll" "$M/Photon3Unity3D.dll" out/dlls/*.dll | tee out/dll-hashes.txt
          dotnet build/types/TabzIlTypes.dll out/types.txt out/dlls/Assembly-CSharp.dll out/dlls/Assembly-CSharp-firstpass.dll out/dlls/Photon3Unity3D.dll

      - name: Install archive tools
        run: python -m pip install --upgrade gdown py7zr

      - name: Download original v5.1 archive
        run: |
          mkdir -p downloads extracted output
          gdown --folder "https://drive.google.com/drive/folders/1Y9vmCWr31-b1du0SFkKop7DODTL9Qvoc?usp=drive_link" -O downloads
          python - <<'PY'
          import pathlib, shutil
          files = [p for p in pathlib.Path("downloads").rglob("*") if p.is_file() and p.suffix.lower() in {".zip", ".7z"} and p.name.lower() not in {"source.zip", "source.7z"}]
          selected = [p for p in files if ("5.1" in p.name.lower() or "v5" in p.name.lower())]
          if len(selected) != 1:
              raise SystemExit("Could not uniquely select archive. Found: " + ", ".join(str(p) for p in files))
          shutil.copy2(selected[0], pathlib.Path("downloads") / ("source" + selected[0].suffix.lower()))
          print("Selected archive:", selected[0].name, selected[0].stat().st_size)
          PY
          python - <<'PY'
          import pathlib, zipfile, py7zr
          archive = next(p for p in pathlib.Path("downloads").glob("source.*"))
          dest = pathlib.Path("extracted/game")
          dest.mkdir(parents=True, exist_ok=True)
          if archive.suffix.lower() == ".zip":
              with zipfile.ZipFile(archive) as z:
                  z.extractall(dest)
          else:
              with py7zr.SevenZipFile(archive) as z:
                  z.extractall(path=dest)
          root = next(p.parent for p in dest.rglob("*_Data") if (p / "globalgamemanagers").is_file())
          pathlib.Path("output/assetripper-input.txt").write_text(str(root.resolve()) + "\n")
          print("AssetRipper input root:", root)
          PY

      - name: Download AssetRipper CLI
        run: |
          curl -fL --retry 3 "https://github.com/nowl-it/AssetRipperCLI/releases/download/v1.0.1/AssetRipper_linux_x64.zip" -o /tmp/assetripper.zip
          mkdir -p /tmp/assetripper
          unzip -q /tmp/assetripper.zip -d /tmp/assetripper
          BIN="$(find /tmp/assetripper -type f | grep -Ei '/(AssetRipper|AssetRipperCLI|assetripper|AssetRipper[.]GUI[.]Free)$' | head -n 1)"
          chmod +x "$BIN"
          echo "ASSET_RIPPER_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Export the original Unity project
        run: |
          "$ASSET_RIPPER_BIN" --cli \
            --input "$(cat output/assetripper-input.txt)" \
            --output "$GITHUB_WORKSPACE/output/v5.1" \
            --mode Unity \
            --script-content-level Level2 \
            --log-path "$GITHUB_WORKSPACE/output/assetripper.log" > /dev/null
          ls output/v5.1/ExportedProject

      - name: Package TabzMinimal
        run: |
          python Tools/Minimal/package_minimal.py \
            --export output/v5.1/ExportedProject \
            --types out/types.txt \
            --dlls out/dlls \
            --template Tools/Minimal/project \
            --project out/TabzMinimal 2>&1 | tee out/package.txt
          du -sh out/TabzMinimal
          find out/TabzMinimal -type f -size +20M -printf '%p %s\n'

      - name: Publish branch tabz-minimal (single commit, only the TabzMinimal folder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pub && mkdir /tmp/pub
          cp -r out/TabzMinimal /tmp/pub/TabzMinimal
          cp out/patch-input.txt out/stub-native.txt out/dll-hashes.txt out/package.txt /tmp/pub/TabzMinimal/ || true
          cd /tmp/pub
          git init -q -b tabz-minimal
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "TabzMinimal: original prefabs, original DLLs (input patched, Steam stubbed), generated by run ${GITHUB_RUN_ID}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin tabz-minimal

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabz-minimal-reports
          path: |
            out/*.txt
            out/TabzMinimal/RECOVERY-REPORT.md
          retention-days: 14
